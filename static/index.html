<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOOFY CULTURE BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#111;font-family:monospace;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-bottom:90px}
.banner{width:100%;border-bottom:3px solid #111;display:block}
.head{padding:14px;text-align:center;font-weight:900;border-bottom:3px solid #111;letter-spacing:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border:2.5px solid #111;border-radius:16px;padding:8px;background:#fff;position:relative}
.pic{aspect-ratio:1;background:#f2f2f2;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic img{width:100%;height:100%;object-fit:cover}
.brand{font-size:10px;opacity:.5;font-weight:900;margin-top:6px;text-transform:uppercase}
.name{font-size:12px;font-weight:900;height:26px;overflow:hidden}
.price{background:#111;color:#fff;padding:7px 10px;border-radius:9px;display:inline-block;font-weight:900;font-size:11px;margin-top:6px}
.price.sold{background:#ff1a1a;transform:rotate(-2deg);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(-2deg) scale(1.05)}}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3.5px solid #111;display:flex;justify-content:space-around;align-items:flex-end;padding:12px 0 14px;text-align:center;z-index:20}
.nav-item{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:80px}
.icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:2.5px solid #111;border-radius:6px;background:#fff;transition:.3s}
.icon.box{width:36px;height:36px;border-radius:8px;position:relative}
.icon.box:before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:16px;height:8px;border:2.5px solid #111;border-bottom:0;border-radius:4px 4px 0 0;background:#fff}
.icon.box.jump{animation:jump .5s ease;background:#111;border-color:#111}
.icon.box.jump:before{background:#111;border-color:#111}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#modal,#cartModal{position:fixed;inset:0;background:#fff;z-index:99;display:none;overflow:auto;max-width:480px;margin:0 auto;border-left:3px solid #111;border-right:3px solid #111}
.gal{width:100%;display:flex;gap:12px;overflow-x:auto;padding:12px;scroll-snap-type:x mandatory}
.gal img{flex:0 0 85%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid #111;background:#f2f2f2;scroll-snap-align:center}
.btn{width:100%;padding:18px;border-radius:14px;font-weight:900;border:3px solid #111;background:#111;color:#fff;font-size:15px}
.btn.added{background:#fff;color:#111;border:3px dashed #111}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 20px;border-radius:12px;font-weight:900;font-size:12px;z-index:100;opacity:0;transition:.4s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><div class="wrap">
<img src="/static/banner.jpg.WEBP" class="banner" onerror="this.style.display='none'">
<div class="head">GOOFY CULTURE • ТОЛЬКО ОРИГИНАЛ</div>
<div class="grid" id="grid"></div>
</div>
<div class="nav">
<div class="nav-item" onclick="closeAll();window.scrollTo(0,0)"><div class="icon">⊞</div><b>Каталог</b></div>
<div class="nav-item" onclick="openCart()"><div class="icon box" id="boxIcon"></div><b id="cartCount">Коробка</b></div>
<div class="nav-item" onclick="Telegram.WebApp.close()"><div class="icon">×</div><b>Закрыть</b></div>
</div>
<div class="toast" id="toast">В КОРОБКЕ 📦</div>
<div id="modal"></div>
<div id="cartModal"></div>
<script>
let P=[], CART_KEY='goofy_box_v3', CART=[];
try{CART=[...new Set((JSON.parse(localStorage.getItem(CART_KEY)||'[]')).map(Number))]}catch(e){CART=[]}
let tg=Telegram.WebApp; tg.ready(); tg.expand();
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function jumpBox(){let b=document.getElementById('boxIcon');b.classList.add('jump');setTimeout(()=>b.classList.remove('jump'),500)}
async function load(){
 try{let r=await fetch('/api/products'); P=await r.json();}catch(e){P=[]}
 document.getElementById('grid').innerHTML=P.map(p=>`
  <div class="card" onclick="openM(${p.id})">
   <div class="pic"><img id="im_${p.id}" src=""></div>
   <div class="brand">${(p.brand||'GOOFY').toUpperCase()}</div>
   <div class="name">${p.name}</div>
   ${p.status==='sold_recent'?`<div class="price sold">СПИЗДИЛИ? САМ ВИНОВАТ!</div>`:`<div class="price">${p.price}₽</div>`}
  </div>`).join('') || '<div style="grid-column:1/3;text-align:center;padding:40px;border:2.5px dashed #111;border-radius:16px">ПУСТО<br>Добавь через /add</div>';
 P.forEach(async p=>{
  let fid=p.img; if(!fid) return;
  try{let rr=await fetch('/api/file/'+fid); let jj=await rr.json(); let el=document.getElementById('im_'+p.id); if(el) el.src=jj.url;}catch(e){}
 });
 updCart();
}
function openM(id){
 let p=P.find(x=>x.id==id); if(!p) return;
 let gal=`<img id="g_${id}" src="">`;
 let btn=p.status==='sold_recent'?`<button disabled class="btn">СПИЗДИЛИ? САМ ВИНОВАТ!</button>`:`<button class="btn" id="addBtn_${id}" onclick="addCart(${p.id})">В КОРЗИНУ — ${p.price}₽</button>`;
 document.getElementById('modal').innerHTML=`
  <div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>${p.brand}</b><span onclick="document.getElementById('modal').style.display='none'" style="font-size:26px;cursor:pointer">✕</span></div>
  <div class="gal">${gal}</div>
  <div style="padding:14px"><h2>${p.name}</h2><div style="opacity:.6;font-size:12px">Размер: ${p.size} ${p.tag?'• '+p.tag:''}</div><h2 style="margin:12px 0">${p.price}₽</h2>${btn}</div>`;
 document.getElementById('modal').style.display='block';
 (async()=>{try{let rr=await fetch('/api/file/'+p.img); let jj=await rr.json(); let el=document.getElementById('g_'+id); if(el) el.src=jj.url;}catch(e){}})();
}
function addCart(id){
 if(CART.includes(id)){toast('УЖЕ В КОРОБКЕ'); return}
 CART.push(id); localStorage.setItem(CART_KEY, JSON.stringify(CART)); jumpBox(); toast('В КОРОБКЕ 📦'); updCart();
 let b=document.getElementById('addBtn_'+id); if(b){b.innerText='ДОБАВЛЕНО ✓'; b.classList.add('added')}
}
function updCart(){document.getElementById('cartCount').innerText=`Коробка (${CART.length})`}
function openCart(){
 let items=P.filter(p=>CART.includes(p.id));
 let sum=items.reduce((a,c)=>a+(+c.price||0),0);
 let html=items.map((c,i)=>`<div style="display:flex;gap:10px;border:2.5px solid #111;border-radius:14px;padding:10px;margin:10px"><img id="c_${c.id}" style="width:80px;height:80px;border-radius:10px;border:2px solid #111;object-fit:cover"><div><b>${c.name}</b><br>${c.price}₽<br><span onclick="CART=CART.filter(x=>x!=${c.id});localStorage.setItem(CART_KEY,JSON.stringify(CART));openCart();updCart()" style="color:red;cursor:pointer">[удалить]</span></div></div>`).join('')||'Пусто';
 document.getElementById('cartModal').innerHTML=`<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>КОРОБКА</b><span onclick="document.getElementById('cartModal').style.display='none'" style="font-size:26px">✕</span></div><div>${html}</div><div style="padding:14px"><b>ИТОГО ${sum}₽</b><div class="btn" style="margin-top:10px;text-align:center" onclick="order()">ОФОРМИТЬ ЗАКАЗ</div></div>`;
 document.getElementById('cartModal').style.display='block';
 items.forEach(async c=>{try{let rr=await fetch('/api/file/'+c.img); let jj=await rr.json(); let el=document.getElementById('c_'+c.id); if(el) el.src=jj.url;}catch(e){}});
}
async function order(){
 let items=P.filter(p=>CART.includes(p.id));
 let sum=items.reduce((a,c)=>a+(+c.price||0),0);
 let u=tg.initDataUnsafe?.user||{};
 try{
  await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u, items:CART, total:sum})});
  toast('ЗАКАЗ УЛЕТЕЛ!'); CART=[]; localStorage.setItem(CART_KEY,JSON.stringify(CART)); updCart(); document.getElementById('cartModal').style.display='none';
 }catch(e){ alert('Ошибка заказа'); }
}
function closeAll(){document.getElementById('modal').style.display='none';document.getElementById('cartModal').style.display='none'}
load();
</script></body></html>
