
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GOOFY CULTURE shop — ТОЛЬКО ОРИГИНАЛ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@700&display=swap');
body{margin:0;background:#e9e1c9;font-family:'Inter',sans-serif;cursor:crosshair}
.banner{width:100%;height:220px;background:#fff center/cover no-repeat url('/static/banner.jpg.WEBP'), url('banner.jpg.WEBP'), url('banner.jpg'); border-bottom:4px solid #000; position:relative; touch-action:manipulation}
.banner::after{content:'5x TAP FOR SECRET 🎁';position:absolute;bottom:6px;right:8px;background:#000;color:#fff;font-size:10px;padding:2px 6px;transform:rotate(-2deg)}
.header{padding:12px 16px;background:#fff;border-bottom:3px dashed #000;display:flex;justify-content:space-between;align-items:center}
.header h1{font-family:'Special Elite';margin:0;font-size:22px;transform:rotate(-1deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border:3px solid #000;transform:rotate(var(--r));position:relative;overflow:hidden}
.card img{width:100%;height:240px;object-fit:cover;display:block}
.card .tape{position:absolute;top:-8px;left:20%;width:60%;height:18px;background:rgba(255,255,0,0.7);transform:rotate(-3deg)}
.info{padding:8px}
.price{font-weight:900;font-size:18px}
.brand{font-size:11px;background:#000;color:#fff;padding:2px 6px;display:inline-block}
.sold-badge{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);background:#ff0040;color:#fff;font-weight:900;padding:8px 12px;font-size:18px;border:3px solid #000;animation:pulse 1.8s infinite;z-index:2}
@keyframes pulse{0%{transform:translate(-50%,-50%) rotate(-15deg) scale(1)}50%{transform:translate(-50%,-50%) rotate(-15deg) scale(1.1)}100%{transform:translate(-50%,-50%) rotate(-15deg) scale(1)}}
.carousel{position:relative;overflow:hidden}
.carousel-track{display:flex;transition:transform 0.3s cubic-bezier(.2,.8,.2,1)}
.carousel-track img{flex:0 0 100%}
.dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:#fff;border:1px solid #000;opacity:.5}
.dot.active{opacity:1;background:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;border:4px solid #000;max-width:520px;width:100%;max-height:90vh;overflow:auto;position:relative}
.modal-close{position:absolute;top:6px;right:10px;font-size:28px;font-weight:900;cursor:pointer}
.modal .big-img{width:100%;height:360px;object-fit:cover}
.jump{animation:jump .4s}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-18px) rotate(-2deg)}100%{transform:translateY(0)}}
#cart{position:fixed;bottom:12px;right:12px;background:#000;color:#fff;padding:12px 18px;border:3px solid #fff;font-weight:900;z-index:50;transform:rotate(-1deg)}
.promo{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#ff0;border:3px solid #000;padding:8px 14px;font-weight:900;display:none;z-index:100}
.promo.show{display:block}
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="header"><h1>GOOFY CULTURE shop — 1 ШТ ОСТАЛОСЬ</h1><span id="count">0 ТОВАРА</span></div>
<div class="grid" id="grid"></div>
<div id="cart">КОРЗИНА: 0</div>
<div class="promo" id="promo">🎁 ПРОМО GOOFY15 активирован -15%</div>
<div class="modal" id="modal"><div class="modal-box"><span class="modal-close" id="mclose">×</span><div class="carousel" id="mcar"><div class="carousel-track" id="mtrack"></div><div class="dots" id="mdots"></div></div><div style="padding:12px"><div id="mbrand" class="brand"></div><h2 id="mname" style="font-family:'Special Elite';margin:8px 0"></h2><div id="mprice" class="price"></div><div id="msizes" style="margin:8px 0;font-size:13px"></div><button id="madd" style="width:100%;background:#000;color:#fff;padding:14px;font-weight:900;border:none;font-size:16px;margin-top:8px">В КОРЗИНУ 🧃</button></div></div></div>
<audio id="pop" src="https://cdn.pixabay.com/audio/2022/03/24/audio_5b9d6cbf57.mp3"></audio>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
let products=[], cart=[], current=null, promo=false
let tapCount=0
const banner=document.getElementById('banner')
banner.addEventListener('click', ()=>{
  tapCount++; 
  if(tapCount>=5){ 
    promo=true; 
    document.getElementById('promo').classList.add('show'); 
    setTimeout(()=>document.getElementById('promo').classList.remove('show'),4000);
    if(window.Telegram && Telegram.WebApp) Telegram.WebApp.HapticFeedback.notificationOccurred('success')
    tapCount=0
  }
  setTimeout(()=>tapCount=0,3000)
})

const urlParams=new URLSearchParams(location.search)
if(urlParams.get('promo')==='GOOFY15'){ promo=true; document.getElementById('promo').classList.add('show') }

async function load(){
  const r=await fetch('/api/products'); products=await r.json()
  document.getElementById('count').textContent=products.length+' ТОВАРА'
  const grid=document.getElementById('grid')
  grid.innerHTML=''
  products.forEach((p,i)=>{
    const card=document.createElement('div'); card.className='card'; card.style.setProperty('--r', (Math.random()*4-2)+'deg')
    const trackImgs=p.image_urls||[]
    card.innerHTML=`
      <div class="tape"></div>
      ${p.status==='sold'?'<div class="sold-badge">СПИЗДИЛИ? САМ ВИНОВАТ!</div>':''}
      <div class="carousel"><div class="carousel-track" style="transform:translateX(0)">${trackImgs.map(u=>`<img src="${u}" loading="lazy">`).join('')}</div><div class="dots">${trackImgs.map((_,k)=>`<div class="dot ${k===0?'active':''}"></div>`).join('')}</div></div>
      <div class="info"><div class="brand">${p.brand||''}</div><div style="font-family:'Special Elite';font-size:14px;margin:4px 0">${p.name}</div><div class="price">${p.price}₽ ${promo?'<span style="color:#f00;text-decoration:line-through;font-size:12px">'+Math.round(p.price*1.15)+'₽</span>':''}</div><div style="font-size:11px">${p.sizes||''}</div></div>
    `
    // swipe logic
    let idx=0
    const track=card.querySelector('.carousel-track')
    const dots=card.querySelectorAll('.dot')
    function go(n){ idx=Math.max(0,Math.min(n, trackImgs.length-1)); track.style.transform=`translateX(-${idx*100}%)`; dots.forEach((d,k)=>d.classList.toggle('active',k===idx)) }
    let sx=0
    card.addEventListener('touchstart', e=>sx=e.touches[0].clientX)
    card.addEventListener('touchend', e=>{ const dx=e.changedTouches[0].clientX-sx; if(dx<-30) go(idx+1); if(dx>30) go(idx-1) })
    card.addEventListener('click', ()=>openModal(p))
    grid.appendChild(card)
  })
}

function openModal(p){
  current=p
  const mtrack=document.getElementById('mtrack')
  mtrack.innerHTML=p.image_urls.map(u=>`<img class="big-img" src="${u}">`).join('')
  document.getElementById('mbrand').textContent=p.brand||''
  document.getElementById('mname').textContent=p.name||''
  let price=p.price
  if(promo) price=Math.round(price*0.85)
  document.getElementById('mprice').textContent=price+'₽'+(promo?' (-15% GOOFY15)':'')
  document.getElementById('msizes').textContent=p.sizes||''
  document.getElementById('modal').classList.add('open')
  // modal carousel swipe
  let idx=0
  const dots=document.getElementById('mdots')
  dots.innerHTML=p.image_urls.map((_,k)=>`<div class="dot ${k===0?'active':''}"></div>`).join('')
  function go(n){ idx=Math.max(0,Math.min(n,p.image_urls.length-1)); mtrack.style.transform=`translateX(-${idx*100}%)`; dots.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('active',k===idx)) }
  let sx=0
  mtrack.addEventListener('touchstart', e=>sx=e.touches[0].clientX, {once:true})
  mtrack.addEventListener('touchend', e=>{ const dx=e.changedTouches[0].clientX-sx; if(dx<-30) go(idx+1); if(dx>30) go(idx-1) }, {once:true})
}

document.getElementById('mclose').onclick=()=>document.getElementById('modal').classList.remove('open')
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') e.currentTarget.classList.remove('open') })

document.getElementById('madd').onclick=()=>{
  if(!current) return
  cart.push(current)
  const el=document.getElementById('madd')
  el.classList.add('jump')
  setTimeout(()=>el.classList.remove('jump'),400)
  document.getElementById('pop').play().catch(()=>{})
  if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.HapticFeedback.impactOccurred('medium') }
  document.getElementById('cart').textContent='КОРЗИНА: '+cart.length
  if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.sendData(JSON.stringify({cart:cart.map(c=>c.id), promo:promo?'GOOFY15':null}))
  }
}

document.getElementById('cart').onclick=()=>{
  if(!cart.length) return
  const text=cart.map(c=>`${c.brand} ${c.name} ${c.price}₽`).join('\n')
  if(confirm('Оформить заказ?\n'+text)){
    if(window.Telegram && Telegram.WebApp){ Telegram.WebApp.sendData(JSON.stringify({order:cart, promo})) }
    else alert('Заказ: '+text)
  }
}

load()
</script>
</body>
</html>
