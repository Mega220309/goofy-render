<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GC BOX</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{box-sizing:border-box;margin:0}body{background:#fff;color:#111;font-family:monospace;overflow-x:hidden}
.wrap{max-width:480px;margin:0 auto;padding-bottom:110px}
.banner{width:100%;display:block;border-bottom:3px solid #111;background:#f2f2f2}
.head{padding:14px;text-align:center;font-weight:900;border-bottom:3px solid #111}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.card{border:2.5px solid #111;border-radius:16px;padding:8px;background:#fff}
.pic{aspect-ratio:1;background:#eee;border-radius:12px;overflow:hidden;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.price{background:#111;color:#fff;padding:6px 9px;border-radius:8px;display:inline-block;font-weight:900;font-size:11px;margin-top:6px}
.tag{position:absolute;top:6px;left:6px;background:#fff;border:2px solid #111;border-radius:6px;padding:2px 6px;font-size:9px;font-weight:900;z-index:2}
.tag +.tag{top:28px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:3.5px solid #111;display:flex;justify-content:space-around;padding:12px 0 18px 0;z-index:999;border-radius:22px 22px 0 0}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;min-width:80px}
.icon{width:46px;height:46px;border:3px solid #111;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff;font-size:22px;line-height:1}
.icon.box{position:relative}
.icon.box:before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:18px;height:9px;border:3px solid #111;border-bottom:0;border-radius:6px 6px 0 0;background:#fff}
.icon.box.jump{animation:jump.5s}
@keyframes jump{50%{transform:translateY(-10px)}}
.nav-label{font-size:14px;font-weight:900;text-align:center;line-height:1}
#modal,#cartModal{position:fixed;inset:0;background:#fff;z-index:100;display:none;overflow:auto;max-width:480px;margin:0 auto;border-left:3px solid #111;border-right:3px solid #111;padding-bottom:120px}
.gal{display:flex;gap:10px;overflow-x:auto;padding:12px}
.gal img{flex:0 0 85%;width:85%;aspect-ratio:1;object-fit:cover;border:3px solid #111;border-radius:16px}
.btn{width:100%;padding:16px;border-radius:12px;font-weight:900;border:3px solid #111;background:#111;color:#fff}
.btn.added{background:#fff;color:#111;border-style:dashed}
.btn:active{animation:shakeBtn.2s}
@keyframes shakeBtn{25%{transform:translateX(-3px) rotate(-1deg)}75%{transform:translateX(3px) rotate(1deg)}}
.toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:10px;font-weight:900;opacity:0;transition:.3s;pointer-events:none;z-index:1000;text-align:center;max-width:90%}
.toast.show{opacity:1}
.flex{margin:12px;border:2.5px solid #111;border-radius:12px;padding:10px}
.bar{height:14px;background:#eee;border:2px solid #111;border-radius:7px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:#111;width:0%;transition:.5s}
.conf{position:fixed;top:-10px;width:8px;height:12px;background:#111;animation:fall 1.2s linear forwards;pointer-events:none;z-index:1001}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.banner-wrap{position:relative;border-bottom:3px solid #111}
.secret{position:absolute;top:0;right:0;padding:14px;opacity:.35;font-size:18px;z-index:5}
#sniffOverlay{position:fixed;inset:0;background:rgba(255,255,255,0.6);backdrop-filter:blur(12px);z-index:900;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#stealthOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:800;display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.receipt{font-family:monospace;background:#fff;border:2.5px dashed #111;padding:14px;margin:12px;border-radius:4px;position:relative}
.shake{animation:shake.3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style></head><body>
<div class="wrap">
<div class="banner-wrap">
<img src="/static/banner.jpg.WEBP" onerror="this.src='/static/banner.webp'" class="banner">
<div class="secret" onclick="steal()">✦</div>
</div>
<div class="head">КАТАЛОГ</div>
<div id="grid" class="grid">Загрузка...</div>
</div>
<div class="nav">
  <div class="nav-item" onclick="vib();closeAll();window.scrollTo(0,0)"><div class="icon">⊞</div><div class="nav-label">Каталог</div></div>
  <div class="nav-item" onclick="vib();openCart()"><div class="icon box" id="boxIcon"></div><div class="nav-label" id="cartCount">Коробка</div></div>
  <div class="nav-item" onclick="vib();if(window.Telegram&&Telegram.WebApp)Telegram.WebApp.close();else window.close()"><div class="icon">×</div><div class="nav-label">Закрыть</div></div>
</div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<div id="cartModal"></div>
<div id="sniffOverlay" onclick="this.style.display='none'"><div style="font-size:50px">👃</div><div id="sniffText" style="font-weight:900;font-size:18px;margin-top:12px;border:3px solid #111;background:#fff;padding:12px;border-radius:12px"></div><div style="margin-top:10px;font-size:10px;font-weight:900;opacity:.5">ЖМИ ЧТОБЫ ПЕРЕСТАТЬ НЮХАТЬ</div></div>
<div id="stealthOverlay" onclick="hideStealth()"><div style="font-size:80px">👁️</div><div style="font-weight:900;font-size:22px;margin-top:10px">ТЫ ЕЩЕ ТУТ?</div></div>
<script>
let P=[], CART_KEY='goofy_box_v3', CART=[], STEAL=0, DISCOUNT=0;
try{CART=JSON.parse(localStorage.getItem(CART_KEY)||'[]')}catch(e){CART=[]}
CART=CART.map(Number);
let tg=window.Telegram&&Telegram.WebApp?Telegram.WebApp:null; if(tg){tg.ready();tg.expand();}
function vib(type){try{if(tg&&tg.HapticFeedback){if(type=='ok')tg.HapticFeedback.notificationOccurred('success');else if(type=='err')tg.HapticFeedback.notificationOccurred('error');else tg.HapticFeedback.impactOccurred('medium');}if(navigator.vibrate)navigator.vibrate(type=='ok'?[50,30,50]:20);}catch(e){}}
function save(){localStorage.setItem(CART_KEY,JSON.stringify(CART));let el=document.getElementById('cartCount');if(el)el.innerText=CART.length?'Коробка ('+CART.length+')':'Коробка';}
save();
function isSoldProduct(p){ return!p || p.sold || p.is_sold || p.stock===0 || p.quantity===0 || p.available===false; }
async function load(){
 let g=document.getElementById('grid');
 try{let r=await fetch('/api/products?t='+Date.now());P=await r.json();}catch(e){g.innerHTML='Ошибка';return;}
 CART=CART.filter(id=>P.some(p=>p.id==id));save();
 if(!P.length){g.innerHTML='<div style="grid-column:1/3;text-align:center;padding:30px;border:2px dashed #111;border-radius:12px;font-weight:900">ПУСТО</div>';return;}
 g.innerHTML=P.map(p=>{
  let sold=isSoldProduct(p);
  let tags = (p.tags||[]).map(t=>'<div class="tag">'+t+'</div>').join('') || (p.size?'<div class="tag">'+p.size+'</div>':'');
  return '<div class="card" style="'+(sold?'opacity:.55':'')+'" onclick="vib();openM('+p.id+')"><div class="pic">'+tags+'<img id="im_'+p.id+'">'+(sold?'<div style="position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;transform:rotate(-12deg);border:2px dashed #fff;text-align:center">СПИЗДИЛИ</div>':'')+'</div><div style="font-size:10px;opacity:.5;font-weight:900;margin-top:4px">'+(p.brand||'')+'</div><div style="font-size:12px;font-weight:900;height:26px;overflow:hidden">'+p.name+'</div><div class="price">'+p.price+'₽</div></div>'
 }).join('');
 P.forEach(async p=>{let fid=(p.images&&p.images[0])?p.images[0]:p.img;if(!fid)return;try{let rr=await fetch('/api/file/'+fid);let jj=await rr.json();let el=document.getElementById('im_'+p.id);if(el)el.src=jj.url;}catch(e){}});
}
function openM(id){
 let p=P.find(x=>x.id==id);if(!p)return;
 let imgs=(p.images&&p.images.length?p.images:[p.img]).filter(Boolean);
 let gal=imgs.map((_,i)=>'<img id="g_'+id+'_'+i+'">').join('');
 let inCart=CART.includes(id);
 let sold=isSoldProduct(p);
 let btnText = sold? 'СПИЗДИЛИ, САМ ВИНОВАТ' : (inCart?'УБРАТЬ ИЗ КОРОБКИ':'ПОЛОЖИТЬ В КОРОБКУ');
 let btnAction = sold? 'vib(\'err\');toast("СПИЗДИЛИ, САМ ВИНОВАТ 💀")' : 'addToBox('+id+')';
 let btnExtraStyle = sold? 'background:#eee;color:#111;opacity:.7;' : '';
 let desc = p.description || p.desc || p.about || '';
 let tagsLine = (p.tags||[]).length? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">'+(p.tags||[]).map(t=>'<span style="border:2px solid #111;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:900">'+t+'</span>').join('')+'</div>' : '';
 document.getElementById('modal').innerHTML='<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b style="font-size:11px;opacity:.6">УЗРИТЕ ЭТОТ ФЛЕЕЕЕЕЕЕКС</b><span onclick="vib();closeAll()" style="font-size:24px;cursor:pointer">✕</span></div><div class="gal">'+gal+'</div><div style="padding:14px"><h2>'+(p.brand||'')+' '+p.name+'</h2>'+tagsLine+'<div style="opacity:.7;margin:6px 0;font-weight:900">'+(p.size||'')+'</div>'+(desc?'<div style="border:2.5px solid #111;border-radius:10px;padding:10px;margin:10px 0;font-size:12px;line-height:1.3;background:#fffaf0"><div style="font-weight:900;margin-bottom:4px">ОПИСАНИЕ ОТ БОМЖА:</div>'+desc+'</div>':'')+'<div style="font-weight:900;font-size:20px;margin:10px 0">'+p.price+'₽</div>'+(sold?'<div style="border:2.5px dashed #111;padding:10px;border-radius:10px;text-align:center;font-weight:900;margin-bottom:10px;background:#111;color:#fff">ЭТОТ ШМОТ УЖЕ СПИЗДИЛИ</div>':'')+'<button class="btn '+(inCart&&!sold?'added':'')+'" style="'+btnExtraStyle+'" onclick="'+btnAction+'">'+btnText+'</button><button onclick="vib();sniff()" style="width:100%;margin-top:8px;padding:12px;border:2.5px dashed #111;border-radius:12px;background:#fff;font-weight:900;color:#111">ПОНЮХАТЬ 👃</button></div>';
 document.getElementById('modal').style.display='block';
 imgs.forEach(async(fid,i)=>{try{let rr=await fetch('/api/file/'+fid);let jj=await rr.json();let el=document.getElementById('g_'+id+'_'+i);if(el)el.src=jj.url;}catch(e){}});
}
function sniff(){const frases=["пахнет секондом с Щелчка, чуть потом и победой","пахнет как будто в ней спали 3 бомжа, но стильно","аромат свободы, сигарет и дорогого парфюма за 1200₽","пахнет флексом. чистый флекс.","бля, это же пахнет как твой будущий успех"];let t=frases[Math.floor(Math.random()*frases.length)];document.getElementById('sniffText').innerText=t;document.getElementById('sniffOverlay').style.display='flex';vib();setTimeout(()=>{document.getElementById('sniffOverlay').style.display='none'},1800);}
function addToBox(id){vib();let p=P.find(x=>x.id==id);if(isSoldProduct(p)){ vib('err');toast('СПИЗДИЛИ, САМ ВИНОВАТ 💀'); return; }let was=CART.includes(id);if(was){CART=CART.filter(x=>x!=id);vib('err');}else{CART.push(id);vib('ok');if(CART.length>=3)boom();}save();closeAll();toast(was?'УБРАЛ':'В КОРОБКЕ 📦');let ic=document.getElementById('boxIcon');if(ic){ic.classList.add('jump');setTimeout(()=>ic.classList.remove('jump'),600);}let g=document.getElementById('grid');if(g){g.classList.add('shake');setTimeout(()=>g.classList.remove('shake'),300);}}
function toast(t){let el=document.getElementById('toast');el.innerText=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function openCart(){vib();renderCart();document.getElementById('cartModal').style.display='block';if(CART.length>=3)boom();}
function closeAll(){document.getElementById('modal').style.display='none';document.getElementById('cartModal').style.display='none';}
function getFlex(){let n=CART.length;if(n==0)return{p:0,txt:'БОМЖ 100% / FLEX 0% - пусто'};if(n==1)return{p:35,txt:'БОМЖ 65% / FLEX 35% - норм'};if(n==2)return{p:70,txt:'БОМЖ 30% / FLEX 70% - свежак'};return{p:100,txt:'БОМЖ 0% / FLEX 100% - БОГ СВЕГА 🔥'};}
function boom(){vib('ok');for(let i=0;i<18;i++){let d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1300);}}
function renderCart(){
 let cm=document.getElementById('cartModal');
 let items=P.filter(p=>CART.includes(p.id));
 let total=items.reduce((s,p)=>s+p.price,0);
 if(DISCOUNT)total=Math.round(total*0.9);
 let flex=getFlex();
 if(!items.length){
   cm.innerHTML='<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>КОРОБКА</b><span onclick="vib();closeAll()" style="font-size:24px">✕</span></div><div class="flex"><div style="display:flex;justify-content:space-between;font-weight:900"><span>FLEX METR</span><span>'+flex.p+'%</span></div><div class="bar"><div class="fill" style="width:'+flex.p+'%"></div></div><div style="font-size:10px;margin-top:4px">'+flex.txt+'</div></div><div style="padding:40px;text-align:center;font-weight:900">ПУСТО</div><div style="padding:14px"><div style="border:3px solid #111;border-radius:16px;padding:14px"><div style="font-weight:900;font-size:13px;margin-bottom:12px;text-align:center">ЧТО БУДЕТ ДАЛЬШЕ?</div><div style="display:flex;gap:10px;margin-bottom:10px"><div style="min-width:36px;height:36px;border:2.5px solid #111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900">1</div><div><div style="font-weight:900;font-size:12px">ЖМЕШЬ ОФОРМИТЬ</div><div style="font-size:11px;opacity:.6">Заявка улетает к нам в ТГ</div></div></div><div style="display:flex;gap:10px;margin-bottom:10px"><div style="min-width:36px;height:36px;border:2.5px solid #111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900">2</div><div><div style="font-weight:900;font-size:12px">ПИШЕТ ТИП ИЗ GOOFY</div><div style="font-size:11px;opacity:.6">Уточнит размер / адрес / скидку</div></div></div><div style="display:flex;gap:10px"><div style="min-width:36px;height:36px;border:2.5px solid #111;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900">3</div><div><div style="font-weight:900;font-size:12px">ОТПРАВЛЯЕМ ЗА ДЕНЬ</div><div style="font-size:11px;opacity:.6">СДЭК 300-500₽ / По Салавату фри</div></div></div></div></div>';
   return;
 }
 cm.innerHTML='<div style="padding:12px;display:flex;justify-content:space-between;border-bottom:3px solid #111"><b>КОРОБКА • '+items.length+'</b><span onclick="vib();closeAll()" style="font-size:24px">✕</span></div><div class="flex"><div style="display:flex;justify-content:space-between;font-weight:900"><span>FLEX METR '+(flex.p==100?'🔥':'')+'</span><span>'+flex.p+'%</span></div><div class="bar"><div class="fill" style="width:'+flex.p+'%"></div></div><div style="font-size:10px;margin-top:4px;font-weight:900">'+flex.txt+'</div></div>'+(DISCOUNT?'<div style="margin:10px;border:2px dashed #111;border-radius:10px;padding:8px;text-align:center;font-weight:900">СКИДКА 10% УКРАДЕНА • GOOFY10</div>':'')+items.map(p=>'<div style="display:flex;gap:10px;border:2px solid #111;border-radius:12px;padding:8px;margin:10px"><img id="c_'+p.id+'" style="width:70px;height:70px;border-radius:8px;border:2px solid #111;object-fit:cover"><div style="flex:1"><div style="font-weight:900">'+p.name+'</div><div>'+p.price+'₽</div></div><div onclick="vib();addToBox('+p.id+');renderCart()" style="font-size:20px;cursor:pointer">✕</div></div>').join('')+'<div style="padding:12px;border-top:3px solid #111;border-bottom:3px solid #111"><div style="display:flex;justify-content:space-between;font-weight:900"><span>ИТОГО '+(DISCOUNT?'-10%':'')+'</span><span>'+total+'₽</span></div><button class="btn" style="margin-top:10px" onclick="vib(\'ok\');checkout()">ОФОРМИТЬ • '+total+'₽</button></div><div style="padding:14px"><div style="border:3px solid #111;border-radius:16px;padding:14px;background:#fff"><div style="font-weight:900;font-size:13px;margin-bottom:12px;text-align:center">ЧТО БУДЕТ ДАЛЬШЕ? 👇</div><div style="display:flex;gap:10px;margin-bottom:12px"><div style="min-width:38px;height:38px;border:2.5px solid #111;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900;background:#111;color:#fff">1</div><div><div style="font-weight:900;font-size:13px">ЖМЕШЬ ОФОРМИТЬ</div><div style="font-size:11px;opacity:.6">Заявка улетает в телегу</div></div></div><div style="display:flex;gap:10px;margin-bottom:12px"><div style="min-width:38px;height:38px;border:2.5px solid #111;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900">2</div><div><div style="font-weight:900;font-size:13px">ПИШЕТ ТИП ИЗ GOOFY</div><div style="font-size:11px;opacity:.6">Уточнит размер, адрес</div></div></div><div style="display:flex;gap:10px"><div style="min-width:38px;height:38px;border:2.5px solid #111;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:900">3</div><div><div style="font-weight:900;font-size:13px">ОТПРАВЛЯЕМ ЗА ДЕНЬ 📦</div><div style="font-size:11px;opacity:.6">СДЭК 300-500₽ • По Салавату бесплатно</div></div></div></div></div>';
 items.forEach(async p=>{let fid=(p.images&&p.images[0])?p.images[0]:p.img;if(!fid)return;try{let rr=await fetch('/api/file/'+fid);let jj=await rr.json();let el=document.getElementById('c_'+p.id);if(el)el.src=jj.url;}catch(e){}});
}
function steal(){vib();STEAL++;if(STEAL>=10&&!DISCOUNT){DISCOUNT=1;STEAL=0;toast('СКИДКА 10% УКРАДЕНА!');boom();}else if(STEAL>3){toast(STEAL+'/10');}}
async function checkout(){
 let items=P.filter(p=>CART.includes(p.id));let total=items.reduce((s,p)=>s+p.price,0);if(DISCOUNT)total=Math.round(total*0.9);
 let u=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)?tg.initDataUnsafe.user:{id:0,first_name:'Гость'};
 try{
  let res=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,items:CART,total,discount:DISCOUNT?10:0})});
  if(res.ok){
   let date = new Date().toLocaleString('ru-RU');
   let list = items.map(p=>'<div style="display:flex;justify-content:space-between;margin:3px 0"><span>'+p.name.slice(0,20)+'</span><span>'+p.price+'₽</span></div>').join('');
